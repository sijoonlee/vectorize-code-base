[project]
name = "codebase-search"
version = "0.1.0"
description = "Local vector search for codebases using Ollama embeddings and LanceDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-ollama>=1.0.0",
    "lancedb>=0.25.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "langchain-text-splitters>=1.1.2",
]

[project.scripts]
codebase-index = "codebase_search.index:main"
codebase-search = "codebase_search.search:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
